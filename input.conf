####################################################################
# input.conf
#
# 跳转（方向键 / 滚轮 / Shift 大跳）叠加两种反馈：
#   osd-msg        左上角文字提示当前进度（mpv 原生样式）
#   flash-progress 底部闪一条 2px 细线，不展开时间轴，避免压住字幕
# 音量：flash-volume，右侧音量条短暂浮出。
# 只想要文字就删掉 "; script-message-to ..."，只想要图形就删掉行首的 osd-msg。
#
# 字幕 / 音轨 / 播放列表等菜单，点控制栏上的对应图标即可
# （字幕菜单里自带「载入字幕」「下载字幕」）。
# 最左边的 MENU 按钮默认打开 uosc 自带菜单（字幕/音轨/清晰度/播放列表/
# 章节/实用工具/退出）。
####################################################################

##################
# 鼠标
##################
MBTN_MID      cycle fullscreen

WHEEL_UP      add volume 2 ; script-message-to uosc flash-volume
WHEEL_DOWN    add volume -2 ; script-message-to uosc flash-volume
WHEEL_LEFT    osd-msg seek -5 exact ; script-message-to uosc flash-progress
WHEEL_RIGHT   osd-msg seek  5 exact ; script-message-to uosc flash-progress

# 鼠标悬停时间轴上时滚轮由 uosc 接管（按 timeline_step 秒跳，默认 5）

##################
# 方向键
##################
RIGHT osd-msg seek  5 exact ; script-message-to uosc flash-progress
LEFT  osd-msg seek -5 exact ; script-message-to uosc flash-progress
UP    add volume  1 ; script-message-to uosc flash-volume
DOWN  add volume -1 ; script-message-to uosc flash-volume

Shift+RIGHT osd-msg seek  30 exact ; script-message-to uosc flash-progress
Shift+LEFT  osd-msg seek -30 exact ; script-message-to uosc flash-progress
Shift+UP    add volume  10 ; script-message-to uosc flash-volume
Shift+DOWN  add volume -10 ; script-message-to uosc flash-volume

##################
# 字幕
##################
Ctrl+UP     add sub-pos -1
Ctrl+DOWN   add sub-pos  1

Ctrl+LEFT   osd-msg sub-seek -1
Ctrl+RIGHT  osd-msg sub-seek  1

# 字幕延时：x / z 加减 0.1s，c 归零。
# scripts/save-sub-delay.lua 会记住每个文件的值，下次打开同一文件自动恢复，
# 所以键位只在这里定义，脚本不占用按键。
x  osd-msg add sub-delay  0.1
z  osd-msg add sub-delay -0.1
c  osd-msg set sub-delay  0

##################
# 音画同步
##################
ctrl+=  osd-msg add audio-delay  0.100
ctrl+-  osd-msg add audio-delay -0.100

##################
# 播放速度
##################
[  add speed -0.1
]  add speed  0.1
{  multiply speed 0.9
}  multiply speed 1.1

##################
# 播放控制
##################
SPACE  cycle pause
ENTER  cycle fullscreen
q      quit-watch-later

####################################################################
# 以下是 uosc 自带功能的可选键位，默认全部注释。
# 行尾「井号紧跟感叹号」的标记是菜单显示名：带标记的命令会出现在 MENU 菜单里，
# 所以即使不绑键，也能从 MENU 按钮点到这些功能。
####################################################################
#s      script-binding uosc/subtitles             #! 字幕
#a      script-binding uosc/audio                 #! 音轨
#v      script-binding uosc/video                 #! 视频轨
#p      script-binding uosc/playlist              #! 播放列表
#k      script-binding uosc/chapters              #! 章节
#o      script-binding uosc/open-file             #! 打开文件
#alt+i  script-binding uosc/keybinds              #! 当前键位表
