####################################################################
# mpv.conf
#
# 这是一份完整的 portable_config：mpv.conf / input.conf / scripts/
# script-opts/ / fonts/
#
# 部署方式：
#   1) 临时指定：mpv --config-dir="/path/to/this/folder" 视频
#   2) 长期使用：运行 installer/install.bat，把 mpv 的配置目录指向
#      这个文件夹；installer/uninstall.bat 可以还原。
####################################################################

##################
# 播放行为
##################
save-position-on-quit=yes
keep-open=yes

##################
# 字幕语言
##################
# 字幕语言优先级，从左到右。未手动选过字幕轨时生效，并覆盖文件里的
# default 标记；音频轨不受影响，那由 alang 控制。
#   zh-Hans / zh-CN / chs  简体
#   zh / chi / zho         只有主语言标记，简繁不明
#   zh-Hant / zh-TW / cht  繁体，中文兜底
#   en / eng               英文
# 带 script 的写法必须逐个列出：mpv 不会把 zh 当成 zh-Hans 的前缀。
slang=zh-Hans,zh-CN,zh-SG,chs,zh,chi,zho,zh-Hant,zh-TW,zh-HK,cht,en,eng
# 外挂字幕带语言后缀（movie.chs.srt）时，要 sub-auto=fuzzy 才会自动加载；
# 默认的 exact 只认完全同名的 movie.srt。

##################
# OSD / 截图
##################
osd-font-size=24

# %n = 重名时自动加序号，避免同一秒截两张图互相覆盖
screenshot-template="%F[%wH.%wM.%wS]%n"
screenshot-directory=~/Pictures/mpv-shot

##################
# 色彩
##################
icc-profile-auto

##################
# 画质
##################
# gpu-hq 等价于 profile=high-quality：
#   scale=ewa_lanczossharp + scale-antiring=0.6 + HDR 微调
profile=gpu-hq

# 色度放大 gpu-hq 不包括，默认是双线性，这里拉到和亮度同一个算法
cscale=ewa_lanczossharp

# 硬解：auto-safe 比 auto 保守，遇到编码器 bug 的片子不会花屏
hwdec=auto-safe

# 跟显示器刷新率同步 + 插帧
video-sync=display-resample
interpolation=yes

# 想要更平滑的插帧可以试 catmull_rom / mitchell（越往下越柔和）

##################
# uosc 集成
##################
# uosc 是完整的 OSC 替代品，必须关掉内置 OSC
osc=no
# uosc 用 flash-progress / flash-volume 自己画进度和音量，不需要 osd-bar
osd-bar=no

##################
# 窗口
##################
# 换片时不要跟着视频分辨率改窗口大小
auto-window-resize=no
